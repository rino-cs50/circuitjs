    <script>
        (function () {
            function menuItem(target) {
                var item = target.closest(".gwt-MenuItem");
                var arrow = target.closest(".subMenuIcon");
                if (!item && arrow)
                    item = arrow.previousElementSibling;
                return item && item.closest(".circuit-menu, .gwt-MenuBarPopup") ? item : null;
            }

            function fitMenu(popup) {
                var list = popup.querySelector(".gwt-MenuBar-vertical");
                if (!list)
                    return;
                var viewport = window.visualViewport;
                var top = viewport ? viewport.offsetTop : 0;
                var bottom = top + (viewport ? viewport.height : window.innerHeight);
                var menuBar = document.querySelector(".circuit-menu");
                if (menuBar)
                    top = Math.max(top, menuBar.getBoundingClientRect().bottom);

                var chromeHeight = popup.getBoundingClientRect().height - list.getBoundingClientRect().height;
                list.style.maxHeight = Math.max(0, Math.floor(bottom - top - chromeHeight - 4)) + "px";
                list.style.overflowY = "auto";
                list.style.overscrollBehavior = "contain";

                // A submenu opens alongside its category, which may be near the bottom.
                // Shift the popup up enough to expose its entire scroll area.
                var bounds = popup.getBoundingClientRect();
                var y = Math.max(top, Math.min(bounds.top, bottom - bounds.height - 4));
                popup.style.top = (parseFloat(popup.style.top) || 0) + y - bounds.top + "px";
            }

            new MutationObserver(function (records) {
                records.forEach(function (record) {
                    record.addedNodes.forEach(function (node) {
                        if (node.nodeType === 1 && node.matches(".gwt-MenuBarPopup"))
                            fitMenu(node);
                    });
                });
            }).observe(document.documentElement, {childList: true, subtree: true});

            function fitOpenMenus() {
                document.querySelectorAll(".gwt-MenuBarPopup").forEach(fitMenu);
            }

            window.addEventListener("resize", fitOpenMenus);
            if (window.visualViewport)
                window.visualViewport.addEventListener("resize", fitOpenMenus);


            // GWT auto-hides a submenu on touchstart in its parent menu.
            // Let the resulting click select the item and keep native scrolling.
            window.addEventListener("touchstart", function (event) {
                if (menuItem(event.target))
                    event.stopImmediatePropagation();
            }, {capture: true, passive: true});

            // GWT's submenu arrow is in a separate table cell.
            window.addEventListener("click", function (event) {
                if (!event.target.closest(".subMenuIcon"))
                    return;
                var item = menuItem(event.target);
                if (item) {
                    event.stopImmediatePropagation();
                    item.click();
                }
            }, true);
        })();
    </script>

	<script>
	    // Close sidebar when clicking backdrop on mobile
	    document.addEventListener('click', function(e) {
	        if (window.innerWidth <= 768) {
	            var sidebar = document.querySelector('.circuit-sidebar');
	            var menuBtn = document.querySelector('.mobile-menu-button');
	            
	            if (sidebar && menuBtn) {
	                var isClickInside = sidebar.contains(e.target) || menuBtn.contains(e.target);
	                
	                if (!isClickInside && sidebar.classList.contains('visible')) {
	                    sidebar.classList.remove('visible');
	                    document.body.classList.remove('sidebar-open');
                    menuBtn.setAttribute('aria-expanded', 'false');
	                }
	            }
	        }
	    });
	</script>
	
	<script>
	// Ensure GWT history iframe is ready
	(function() {
	    var iframe = document.getElementById('__gwt_historyFrame');
	    if (iframe && iframe.contentWindow) {
	        try {
	            iframe.contentWindow.document;
	        } catch(e) {
	            // Ignore - will be ready later
	        }
	    }
	})();
	</script>
